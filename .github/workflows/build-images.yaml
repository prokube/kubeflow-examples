name: Build Images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main
    tags:
    - 'v*'

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.build.outputs.publish }}
      registry: ${{ steps.build.outputs.registry }}
      release: ${{ steps.build.outputs.release }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Test registry lifecycle contract
      run: python3 .github/testing/test_registry_lifecycle.py

    - name: Resolve build
      id: build
      run: python3 .github/scripts/resolve_build.py

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: minimal-mnist
          context: images/minimal-mnist
          dockerfile: images/minimal-mnist/Dockerfile
        - image: streamlit-example
          context: images/streamlit-example
          dockerfile: images/streamlit-example/Dockerfile
        - image: mobile-price-classification
          context: pipelines/lightweight-python-package
          dockerfile: pipelines/lightweight-python-package/Dockerfile
        - image: minimal-custom-kserve-predictor
          context: serving/minimal-custom-kserve-predictor
          dockerfile: serving/minimal-custom-kserve-predictor/Dockerfile
        - image: minimal-predictor
          context: serving/minimal-example-shadow-deployment/minimal-predictor
          dockerfile: serving/minimal-example-shadow-deployment/minimal-predictor/Dockerfile
        - image: minimal-transformer
          context: serving/minimal-example-shadow-deployment/minimal-transformer
          dockerfile: serving/minimal-example-shadow-deployment/minimal-transformer/Dockerfile
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      if: github.event_name != 'pull_request'
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Log in to Google Artifact Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: europe-west3-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Check immutable release artifact
      id: artifact
      if: github.event_name != 'pull_request' && needs.prepare.outputs.release == 'true'
      env:
        IMAGE: ${{ matrix.image }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        gcloud artifacts repositories describe releases \
          --location=europe-west3 \
          --project=prokube >/dev/null
        STATE=$(REGISTRY_TOKEN="$(gcloud auth print-access-token)" \
          python3 .github/scripts/registry_manifest.py \
          --registry europe-west3-docker.pkg.dev \
          --image "prokube/releases/$IMAGE" \
          --tag "$TAG")
        if [[ "$STATE" == "exists" ]]; then
          echo "$IMAGE:$TAG already exists; preserving the immutable release artifact"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build pull request image
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: false
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    - name: Build and push release image
      if: github.event_name != 'pull_request' && needs.prepare.outputs.release == 'true' && steps.artifact.outputs.exists != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    - name: Build and push development image
      if: github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.release != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/{1}:latest', needs.prepare.outputs.registry, matrix.image) || '' }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
