name: Build Images

on:
  workflow_dispatch:
  pull_request:
    paths:
    - .github/workflows/build-images.yaml
    - images/minimal-mnist/**
    - images/streamlit-example/**
    - pipelines/lightweight-python-package/**
    - serving/minimal-custom-kserve-predictor/**
    - serving/minimal-example-shadow-deployment/**
  push:
    branches:
    - main
    tags:
    - 'v*'
    paths:
    - .github/workflows/build-images.yaml
    - images/minimal-mnist/**
    - images/streamlit-example/**
    - pipelines/lightweight-python-package/**
    - serving/minimal-custom-kserve-predictor/**
    - serving/minimal-example-shadow-deployment/**

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.target.outputs.registry }}
      release: ${{ steps.target.outputs.release }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
    - name: Resolve target
      id: target
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [[ "$EVENT" == "push" && "$REF" == refs/tags/* ]]; then
          if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc(0|[1-9][0-9]*))?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-rcN" >&2
            exit 1
          fi
          {
            echo "registry=europe-west3-docker.pkg.dev/prokube/releases"
            echo "release=true"
            echo "tag=$REF_NAME"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "registry=europe-west3-docker.pkg.dev/prokube/development"
            echo "release=false"
            echo "tag=commit-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: minimal-mnist
          context: images/minimal-mnist
          dockerfile: images/minimal-mnist/Dockerfile
        - image: streamlit-example
          context: images/streamlit-example
          dockerfile: images/streamlit-example/Dockerfile
        - image: mobile-price-classification
          context: pipelines/lightweight-python-package
          dockerfile: pipelines/lightweight-python-package/Dockerfile
        - image: minimal-custom-kserve-predictor
          context: serving/minimal-custom-kserve-predictor
          dockerfile: serving/minimal-custom-kserve-predictor/Dockerfile
        - image: minimal-predictor
          context: serving/minimal-example-shadow-deployment/minimal-predictor
          dockerfile: serving/minimal-example-shadow-deployment/minimal-predictor/Dockerfile
        - image: minimal-transformer
          context: serving/minimal-example-shadow-deployment/minimal-transformer
          dockerfile: serving/minimal-example-shadow-deployment/minimal-transformer/Dockerfile
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      if: github.event_name != 'pull_request'
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Log in to Google Artifact Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: europe-west3-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Check immutable release artifact
      if: needs.prepare.outputs.release == 'true'
      env:
        IMAGE: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        if OUTPUT=$(gcloud artifacts docker images describe "$IMAGE" 2>&1); then
          echo "$IMAGE already exists; refusing to overwrite it" >&2
          exit 1
        fi
        if [[ "$OUTPUT" != *"NOT_FOUND"* ]]; then
          echo "$OUTPUT" >&2
          exit 1
        fi

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ needs.prepare.outputs.release == 'true' && format('{0}/{1}:{2}', needs.prepare.outputs.registry, matrix.image, needs.prepare.outputs.tag) || format('{0}/{1}:{2},{0}/{1}:latest', needs.prepare.outputs.registry, matrix.image, needs.prepare.outputs.tag) }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
